<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        .myimg{
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <h1>This is Bootstrap Session</h1>
    
    <div class="container mt-5">
        <!-- button classes -->
         <button type="button" >Done</button>
         <button type="button"  class="btn">Done</button>
         <button type="button"  class="btn btn-primary">Done</button>
         <button type="button"  class="btn btn-success">Done</button>
         <button type="button"  class="btn btn-outline-danger">Done</button>
         <br><br>
         <button type="button"  class="btn btn-outline-danger btn-lg">Done</button>
         <button type="button"  class="btn btn-primary btn-sm">Done</button>
         <button type="button"  class="btn btn-primary btn-lg">Done</button>

         <hr>

         <div class="d-grid">
            <!-- button with full width -->

            <button type="button" class="btn btn-success">          
                  <span class="spinner-grow spinner-border-lg text-info"></span>Done
            </button>
         </div>

         <hr>
         <!-- spinner -->
            <span class="spinner-border"></span>
            <span class="spinner-border spinner-border-sm text-success"></span>
            <span class="spinner-border spinner-border-lg text-info"></span>
            <span class="spinner-border spinner-border-lg text-danger"></span>
            <span class="spinner-grow text-info "></span>
            <span class="spinner-grow text-info spinner-border-lg"></span>
            <span class="spinner-grow text-info spinner-grow-sm"></span>


            <button><span class="spinner-border text-danger">Done</span></button>



         <hr>
         <!-- img classes -->
        <img class="myimg rounded" src="../Assets/dosa.jpeg" alt="" width="300px" height="300px">
        <img class="myimg rounded-circle" src="../Assets/pizza.jpg" alt=""  width="350px" height="350px">
        <img class="myimg img-thumbnail" src="../Assets/momos.jpg" alt="" width="300px" height="300px">
    </div>
    <br><br>
    <!-- color classes -->
     <h2 class="text-primary bg-danger">Hello Friends How are you all</h2>
     <h2 class="text-secondary bg-dark">Hello Friends How are you all</h2>
     <h2 class="text-info">Hello Friends How are you all</h2>
     <h2 class="text-danger">Hello Friends How are you all</h2>
     <h2 class="text-warning">Hello Friends How are you all</h2>
     <h2 class="text-success">Hello Friends How are you all</h2>
     <h2 class="text-muted">Hello Friends How are you all</h2>
     <h2 class="text-dark">Hello Friends How are you all</h2>

</body>
</html>
