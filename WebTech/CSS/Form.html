<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>
    <div class="container mt-2">

        <form class="was-validated">
            <div class="form-group">
                <label for="uname" class="form-label"><b>Name:</b> </label>
                <input type="text" name="fname" class="form-control" id="uname" required> 
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span><br>
            </div>
            <div class="form-group">
                <label for="uemail" class="form-label"><b>Email:</b> </label>
                <input type="email" name="pass" class="form-control" id="uemail" required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>

            <div class="form-group">
                <label for="pass" class="form-label"><b>Password:</b> </label>
                <input type="password" name="pass" class="form-control" id="pass" required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>

            <div class="form-group">
                <label for="ucontact" class="form-label"><b>Contact:</b> </label>
                <input type="number" name="pass" class="form-control" id="ucontact" required>
                <span class="valid-feedback">valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>
            <br>

             <div class="form-group">
                <label for="gen" class="form-check-label">
                    <input type="radio" name="gender" class="form-check-input" value="male" required>Male
                </label>
                <label for="gen" class="form-check-label">
                    <input type="radio" name="gender" class="form-check-input" value="female" required>Female
                </label>
                
            </div> <br>
             <label for="" class="form-check-label">
                    <input type="checkbox"  class="form-check-input" value="accept" required> I accept terms & condition.
                </label>
            <br>

            <div class="form-group">

                <label for="" class="form-label">Select Your Course:</label>
                <select name="course" id="" class="form-control" required>
                    <option value="" >---Select your Course---</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JS">JS</option>
                    <option value="nodejs">NodeJs</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary mt-2">Apply</button>

        </form>
    </div>
</body>

</html>
