<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 1. element selector */
        h2{
            color: rgb(231, 160, 5);
            text-align: center;
            background-color: aquamarine;
        }
        /* 2. group selector */
        strong,b,u{
            color: black;
            font-size: 30px;
            text-transform: uppercase;
        }

        /* 3. id selector */
        #dv6{
            background-color: fuchsia;
            font-family: cursive;
            font-size: 33px;
        }
        /* 4. class selector */
        .cls1{
            color:rgb(28, 160, 211);
            text-align: center;
        }

        /* 5. universal selector */

        *{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    
    <h2>Virat</h2>
    <strong>Rohit</strong> <br>
    <b>KL</b> <br>
    <u>Shikhar</u>

    <div class="cls1">This is div 1</div>
    <div class="cls1">This is div 2</div>
    <div class="cls1">This is div 3</div>
    <div class="cls1">This is div 4</div>
    <div class="cls1">This is div 5</div>

    <div id="dv6">This is div 6</div>

</body>
</html>
