<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <center>
        <img id="img1" src="../Assets/dosa.jpeg" alt="dosa" width="50%" height="300px"><br>
        <button type="button" id="btn2">FadeIn</button>
        <button type="button" id="btn1">FadeOut</button>
        <button type="button" id="btn3">FadeToggle</button>
        <hr>
        <img id="img2" src="../Assets/momos.jpg" alt="momo" width="50%" height="300px">
        <button type="button" id="btn4">slideup</button>
        <button type="button" id="btn5">slidedown</button>
        <button type="button" id="btn6">slidetoggle</button>
    </center>
    <script>
        $(document).ready(function(){

            $("#btn1").click(() => { $('#img1').fadeIn(2000); });
            $("#btn2").click(() => { $('#img1').fadeOut(2000); });
            $("#btn3").click(() => { $('#img1').fadeToggle(2000); });

            $("#btn4").click(() => { $('#img2').slideUp(2000); });
            $("#btn5").click(() => { $('#img2').slideDown(2000); });
            $("#btn6").click(() => { $('#img2').slideToggle(2000); });
        });
    </script>
</body>
</html>
